name: Publish llmnex image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing llmnex-v* tag to publish'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cddave/llmnex-new-api

jobs:
  publish:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
          else
            echo "::error::Unsupported event '$EVENT_NAME'"
            exit 1
          fi

          case "$TAG" in
            llmnex-v*) ;;
            *)
              echo "::error::Tag '$TAG' must start with llmnex-v"
              exit 1
              ;;
          esac

          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Tag '$TAG' does not exist"
            exit 1
          fi

          git checkout --detach "refs/tags/$TAG"
          echo "$TAG" > VERSION
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate GHCR credentials
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          TOKEN_OWNER=$(gh api user --jq '.login')
          TOKEN_HEADERS=$(gh api --include user)
          TOKEN_SCOPES=$(printf '%s\n' "$TOKEN_HEADERS" | awk '
            BEGIN { IGNORECASE=1 }
            /^x-oauth-scopes:/ {
              sub(/^[^:]+:[[:space:]]*/, "")
              print
              exit
            }
          ')

          echo "GHCR token owner: $TOKEN_OWNER"
          echo "GHCR token scopes: $TOKEN_SCOPES"

          if [ "${TOKEN_OWNER,,}" != "${GITHUB_REPOSITORY_OWNER,,}" ]; then
            echo "::error::GHCR_TOKEN belongs to '$TOKEN_OWNER', expected '$GITHUB_REPOSITORY_OWNER'"
            exit 1
          fi

          case ",${TOKEN_SCOPES// /}," in
            *,write:packages,*) ;;
            *)
              echo "::error::GHCR_TOKEN does not have write:packages"
              exit 1
              ;;
          esac

          gh api \
            --method GET \
            /user/packages \
            -f package_type=container \
            >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
